apiVersion: v1
kind: Namespace
metadata:
  name: careld-vision
  labels:
    name: careld-vision
    app.kubernetes.io/name: careld-vision
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/environment: production
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: careld-quota
  namespace: careld-vision
spec:
  hard:
    requests.cpu: "20"
    requests.memory: 40Gi
    limits.cpu: "40"
    limits.memory: 80Gi
    persistentvolumeclaims: "10"
    services.loadbalancers: "5"
    services.nodeports: "10"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: careld-limits
  namespace: careld-vision
spec:
  limits:
    - default:
        cpu: "1"
        memory: 2Gi
      defaultRequest:
        cpu: 100m
        memory: 512Mi
      type: Container
