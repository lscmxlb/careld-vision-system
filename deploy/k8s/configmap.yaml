apiVersion: v1
kind: ConfigMap
metadata:
  name: careld-config
  namespace: careld-vision
  labels:
    app: careld-vision
data:
  # 应用配置
  SPRING_PROFILES_ACTIVE: "prod"
  TZ: "Asia/Shanghai"
  
  # 数据库配置
  MYSQL_HOST: "careld-mysql"
  MYSQL_PORT: "3306"
  MYSQL_DATABASE: "careld_vision"
  
  # Redis配置
  REDIS_HOST: "careld-redis"
  REDIS_PORT: "6379"
  REDIS_DATABASE: "0"
  
  # 服务地址配置
  AUTH_SERVICE_URL: "http://careld-auth-service:8281"
  USER_SERVICE_URL: "http://careld-user-service:8282"
  STORE_SERVICE_URL: "http://careld-store-service:8283"
  CHILD_SERVICE_URL: "http://careld-child-service:8284"
  SCHEDULE_SERVICE_URL: "http://careld-schedule-service:8285"
  VISION_SERVICE_URL: "http://careld-vision-service:8286"
  SYNC_SERVICE_URL: "http://careld-sync-service:8287"
  
  # 日志配置
  LOG_LEVEL_ROOT: "INFO"
  LOG_LEVEL_APP: "DEBUG"
  
  # 缓存配置
  CACHE_TTL_MINUTES: "30"
  
  # 文件上传配置
  FILE_MAX_SIZE: "10485760"
  FILE_ALLOWED_TYPES: "jpg,jpeg,png,pdf,doc,docx"
  
  # 分页配置
  PAGE_DEFAULT_SIZE: "20"
  PAGE_MAX_SIZE: "100"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-config
  namespace: careld-vision
data:
  my.cnf: |
    [mysqld]
    character-set-server=utf8mb4
    collation-server=utf8mb4_unicode_ci
    default-storage-engine=InnoDB
    innodb_buffer_pool_size=1G
    innodb_log_file_size=256M
    innodb_flush_log_at_trx_commit=2
    max_connections=500
    wait_timeout=28800
    interactive_timeout=28800
    
    [client]
    default-character-set=utf8mb4
    
    [mysql]
    default-character-set=utf8mb4
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-config
  namespace: careld-vision
data:
  redis.conf: |
    bind 0.0.0.0
    port 6379
    tcp-backlog 511
    timeout 0
    tcp-keepalive 300
    daemonize no
    supervised no
    pidfile /var/run/redis_6379.pid
    loglevel notice
    logfile ""
    databases 16
    always-show-logo yes
    save 900 1
    save 300 10
    save 60 10000
    stop-writes-on-bgsave-error yes
    rdbcompression yes
    rdbchecksum yes
    dbfilename dump.rdb
    dir /data
    maxmemory 2gb
    maxmemory-policy allkeys-lru
