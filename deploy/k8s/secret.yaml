apiVersion: v1
kind: Secret
metadata:
  name: careld-secrets
  namespace: careld-vision
  labels:
    app: careld-vision
type: Opaque
stringData:
  # ============================================================
  # 重要: 部署前必须替换以下所有占位符为实际的强密码/密钥!
  # 可使用以下命令生成随机密码:
  #   openssl rand -base64 24
  # ============================================================

  # 数据库密码
  MYSQL_ROOT_PASSWORD: "<REPLACE_WITH_STRONG_PASSWORD>"
  MYSQL_USER_PASSWORD: "<REPLACE_WITH_STRONG_PASSWORD>"

  # Redis密码
  REDIS_PASSWORD: "<REPLACE_WITH_STRONG_PASSWORD>"

  # JWT密钥 (至少64字符的随机字符串)
  JWT_SECRET: "<REPLACE_WITH_RANDOM_64_CHAR_STRING>"
  JWT_REFRESH_SECRET: "<REPLACE_WITH_RANDOM_64_CHAR_STRING>"

  # API密钥
  API_KEY_INTERNAL: "<REPLACE_WITH_RANDOM_STRING>"

  # 加密密钥 (必须恰好32字节)
  ENCRYPTION_KEY: "<REPLACE_WITH_EXACTLY_32_CHAR_STRING>"
---
apiVersion: v1
kind: Secret
metadata:
  name: tls-secret
  namespace: careld-vision
type: kubernetes.io/tls
data:
  # 部署前必须替换为实际TLS证书的base64编码内容
  # 生成命令: kubectl create secret tls tls-secret --cert=path/to/cert --key=path/to/key --dry-run=client -o yaml
  tls.crt: "<BASE64_ENCODED_TLS_CERT>"
  tls.key: "<BASE64_ENCODED_TLS_PRIVATE_KEY>"
